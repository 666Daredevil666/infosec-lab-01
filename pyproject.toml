[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "infosec-lab-01"
version = "1.0.0"
description = "Educational Flask API with SQLite, Argon2 and JWT"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<4", "PyJWT>=2.10,<3", "argon2-cffi>=25.1,<26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
