name: Tests and Security
run-name: "Security checks #${{ github.run_number }}"
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests-and-bandit:
    name: Tests and Code Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: |
          mkdir -p evidence
          python -m pip inspect --local > evidence/packages.json
      - run: python -m pytest -v --junitxml=evidence/pytest.xml
      - name: Bandit SAST
        if: ${{ !cancelled() }}
        run: bandit -r src -f json -o evidence/bandit.json
      - name: Additional dependency audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt -f json -o evidence/pip-audit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tests-and-local-security
          path: evidence/
  snyk-sca:
    name: Snyk Dependency Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm install -g snyk
      - name: Require Snyk credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "Configure repository secret SNYK_TOKEN; SCA has not run."
            exit 1
          fi
      - name: Snyk SCA
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          mkdir -p evidence
          snyk test --file=requirements.txt --package-manager=pip --json-file-output=evidence/snyk.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snyk-sca-report
          path: evidence/snyk.json
  project-summary:
    name: Project Summary
    needs: [tests-and-bandit, snyk-sca]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          path: evidence
          pattern: "*-security"
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: snyk-sca-report
          path: evidence
      - run: python -m pip install defusedxml==0.7.1
      - name: Build report
        run: python scripts/report.py
      - uses: actions/upload-artifact@v7
        with:
          name: project-summary
          path: full-report/
          if-no-files-found: error
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download application dependencies
        run: |
          mkdir -p dependency-scan
          python -m pip download --only-binary=:all: --no-deps -r requirements.txt -d dependency-scan
          cp requirements.txt dependency-scan/
      - name: Scan dependencies
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c
        with:
          project: infosec-lab-01
          path: dependency-scan
          format: ALL
          out: dependency-check-report
          args: >
            --enableExperimental
            --disableOssIndex
            --failOnCVSS 7
      - name: Upload OWASP report
        if: ${{ !cancelled() && hashFiles('dependency-check-report/dependency-check-report.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: full-report
          path: dependency-check-report/
          if-no-files-found: error
